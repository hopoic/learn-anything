<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>보글보글 (Bubble Bobble) - Classic Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: 'Press Start 2P', 'Noto Sans KR', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
        }

        /* 아케이드 캐비닛 프레임 */
        .arcade-cabinet {
            width: 100%;
            max-width: 720px;
            background: linear-gradient(180deg, #1b1e2e 0%, #11131e 100%);
            border: 4px solid #3b4269;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 상단 HUD 점수판 */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #05060a;
            border: 2px solid #2d3559;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 11px;
            line-height: 1.5;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            color: #38bdf8;
            font-size: 9px;
            margin-bottom: 3px;
        }

        .hud-label.high {
            color: #f43f5e;
        }

        .hud-label.stage {
            color: #4ade80;
        }

        .hud-value {
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .hud-lives {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #4ade80;
        }

        /* 캔버스 컨테이너 (4:3 아케이드 비율 유지) */
        .screen-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000000;
            border: 4px solid #252a44;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* CRT 스캔라인 효과 */
        .scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* 하단 컨트롤 바 (모바일/마우스 터치 + 사운드/재시작 버튼) */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .touch-pad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 4px 2px;
        }

        .dpad-group, .action-group {
            display: flex;
            gap: 10px;
        }

        .arcade-btn {
            font-family: 'Press Start 2P', 'Noto Sans KR', monospace;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.06s ease, filter 0.1s ease;
            position: relative;
        }

        .arcade-btn:active, .arcade-btn.pressed {
            transform: translateY(4px);
            filter: brightness(1.15);
        }

        .btn-dir {
            width: 66px;
            height: 58px;
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 5px 0 #1e3a8a, 0 8px 15px rgba(0,0,0,0.5);
            font-size: 18px;
        }

        .btn-dir:active, .btn-dir.pressed {
            box-shadow: 0 1px 0 #1e3a8a;
        }

        .btn-jump {
            width: 76px;
            height: 58px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            box-shadow: 0 5px 0 #14532d, 0 8px 15px rgba(0,0,0,0.5);
            font-size: 11px;
            gap: 4px;
        }

        .btn-jump:active, .btn-jump.pressed {
            box-shadow: 0 1px 0 #14532d;
        }

        .btn-fire {
            width: 82px;
            height: 58px;
            background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
            box-shadow: 0 5px 0 #881337, 0 8px 15px rgba(0,0,0,0.5);
            font-size: 11px;
            gap: 4px;
        }

        .btn-fire:active, .btn-fire.pressed {
            box-shadow: 0 1px 0 #881337;
        }

        .sub-label {
            font-size: 9px;
            opacity: 0.9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 유틸리티 버튼 행 (사운드, BGM, 재시작) */
        .utility-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .util-btn {
            flex: 1;
            min-width: 110px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            font-family: 'Press Start 2P', 'Noto Sans KR', monospace;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #020617;
            transition: all 0.1s;
        }

        .util-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #020617;
        }

        .util-btn.active {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .util-btn.restart {
            border-color: #f59e0b;
            color: #fbbf24;
        }

        .guide-text {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            font-family: 'Noto Sans KR', sans-serif;
            margin-top: 2px;
        }

        @media (max-width: 520px) {
            .hud-bar { padding: 8px 8px; }
            .hud-value { font-size: 11px; }
            .btn-dir { width: 56px; height: 52px; }
            .btn-jump { width: 66px; height: 52px; }
            .btn-fire { width: 72px; height: 52px; }
        }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <!-- 상단 아케이드 스코어보드 -->
    <div class="hud-bar">
        <div class="hud-group">
            <span class="hud-label">1UP SCORE</span>
            <span class="hud-value" id="hudScore">000000</span>
        </div>
        <div class="hud-group">
            <span class="hud-label high">HIGH SCORE</span>
            <span class="hud-value" id="hudHighScore">010000</span>
        </div>
        <div class="hud-group">
            <span class="hud-label stage">STAGE</span>
            <span class="hud-value" id="hudStage">01</span>
        </div>
        <div class="hud-group">
            <span class="hud-label">LIVES</span>
            <div class="hud-lives" id="hudLives">🦖🦖🦖</div>
        </div>
    </div>

    <!-- 게임 캔버스 화면 -->
    <div class="screen-wrapper" id="screenWrapper">
        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>
    </div>

    <!-- 컨트롤러 및 유틸리티 버튼 -->
    <div class="controls-panel">
        <div class="touch-pad">
            <div class="dpad-group">
                <button class="arcade-btn btn-dir" id="btnLeft" aria-label="Left">◀</button>
                <button class="arcade-btn btn-dir" id="btnRight" aria-label="Right">▶</button>
            </div>
            <div class="action-group">
                <button class="arcade-btn btn-jump" id="btnJump">
                    <span>JUMP</span>
                    <span class="sub-label">점프 (↑)</span>
                </button>
                <button class="arcade-btn btn-fire" id="btnFire">
                    <span>BUBBLE</span>
                    <span class="sub-label">거품 (Space)</span>
                </button>
            </div>
        </div>

        <div class="utility-bar">
            <button class="util-btn active" id="btnSfx">🔊 SFX: ON</button>
            <button class="util-btn active" id="btnBgm">🎵 BGM: ON</button>
            <button class="util-btn restart" id="btnRestart">🔄 RESTART (다시하기)</button>
        </div>

        <div class="guide-text">
            키보드: ◀ ▶ 이동 | ▲ 점프 | Space / Z 거품 발사 | 거품에 갇힌 적을 몸으로 터뜨려 과일을 먹으세요!
        </div>
    </div>
</div>

<script>
/**
 * ============================================================================
 * 보글보글 (BUBBLE BOBBLE) - 8-BIT RETRO ARCADE ENGINE
 * ============================================================================
 * - 논리 해상도: 640 x 480 (4:3 아케이드 표준 비율)
 * - 주요 메커니즘: 단방향 플랫폼 점프 통과, 수평 거품 발사 및 적 포획,
 *   천장 기류 부유, 인접 거품 연쇄 폭발(Chain Pop), 보너스 과일 아이템,
 *   시간 초과 시 적 분노(Angry) 상태 전환, Web Audio API 레트로 칩튠 사운드.
 */

// ----------------------------------------------------------------------------
// 1. WEB AUDIO API 레트로 칩튠 사운드 & BGM 합성기
// ----------------------------------------------------------------------------
class RetroAudio {
    constructor() {
        this.ctx = null;
        this.sfxEnabled = true;
        this.bgmEnabled = true;
        this.bgmTimer = null;
        this.noteIndex = 0;

        // 보글보글 풍의 경쾌한 8비트 아케이드 멜로디 주파수 (Hz)
        this.melody = [
            { f: 523.25, d: 0.14 }, { f: 659.25, d: 0.14 }, { f: 783.99, d: 0.14 }, { f: 659.25, d: 0.14 },
            { f: 587.33, d: 0.14 }, { f: 698.46, d: 0.14 }, { f: 880.00, d: 0.14 }, { f: 698.46, d: 0.14 },
            { f: 523.25, d: 0.14 }, { f: 659.25, d: 0.14 }, { f: 783.99, d: 0.28 }, { f: 0,      d: 0.14 },
            { f: 783.99, d: 0.14 }, { f: 880.00, d: 0.14 }, { f: 987.77, d: 0.14 }, { f: 1046.50,d: 0.28 },
            { f: 987.77, d: 0.14 }, { f: 880.00, d: 0.14 }, { f: 783.99, d: 0.14 }, { f: 659.25, d: 0.14 },
            { f: 587.33, d: 0.14 }, { f: 659.25, d: 0.14 }, { f: 523.25, d: 0.28 }, { f: 0,      d: 0.14 }
        ];
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, type, duration, gainVal = 0.12, slideTo = null) {
        if (!this.sfxEnabled) return;
        this.init();
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
            }
            gain.gain.setValueAtTime(gainVal, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
        } catch (e) {}
    }

    playJump() {
        this.playTone(220, 'square', 0.18, 0.1, 620);
    }

    playShoot() {
        this.playTone(480, 'triangle', 0.11, 0.14, 180);
    }

    playPop(combo = 0) {
        const base = 520 + Math.min(combo * 90, 500);
        this.playTone(base, 'sine', 0.14, 0.18, base * 1.8);
    }

    playPickup() {
        this.playTone(587.33, 'square', 0.08, 0.1);
        setTimeout(() => this.playTone(880, 'square', 0.14, 0.12), 70);
    }

    playHurt() {
        this.playTone(320, 'sawtooth', 0.35, 0.15, 75);
    }

    playStageClear() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'square', 0.15, 0.12), idx * 110);
        });
    }

    playGameOver() {
        const notes = [440, 415.3, 392, 349.23, 261.63];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'sawtooth', 0.25, 0.12), idx * 180);
        });
    }

    startBgm() {
        this.stopBgm();
        if (!this.bgmEnabled) return;
        this.init();
        const step = () => {
            if (!this.bgmEnabled) return;
            const note = this.melody[this.noteIndex % this.melody.length];
            if (note.f > 0 && this.ctx && this.ctx.state === 'running') {
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(note.f, now);
                    gain.gain.setValueAtTime(0.035, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + note.d * 0.9);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + note.d);
                } catch (e) {}
            }
            this.noteIndex++;
            this.bgmTimer = setTimeout(step, note.d * 1000);
        };
        step();
    }

    stopBgm() {
        if (this.bgmTimer) {
            clearTimeout(this.bgmTimer);
            this.bgmTimer = null;
        }
    }
}

const audio = new RetroAudio();

// ----------------------------------------------------------------------------
// 2. 게임 상수 및 스테이지 데이터 (논리 해상도 640x480)
// ----------------------------------------------------------------------------
const W = 640;
const H = 480;
const WALL_W = 24;
const FLOOR_H = 24;
const GRAVITY = 0.48;
const MAX_FALL_SPEED = 9.5;

// 3개의 클래식 보글보글 스타일 스테이지 레이아웃
const STAGES = [
    {
        name: "STAGE 1 - CAVE START",
        themeColor: "#3b82f6",
        themeHighlight: "#93c5fd",
        platforms: [
            // 하단에서 상단 순 단방향 발판 (x, y, width)
            { x: 96,  y: 372, w: 448 },
            { x: 24,  y: 288, w: 160 },
            { x: 456, y: 288, w: 160 },
            { x: 140, y: 204, w: 360 },
            { x: 24,  y: 124, w: 140 },
            { x: 476, y: 124, w: 140 }
        ],
        enemies: [
            { type: 'zen', x: 180, y: 160, dir: 1 },
            { type: 'zen', x: 420, y: 160, dir: -1 },
            { type: 'zen', x: 300, y: 330, dir: 1 }
        ]
    },
    {
        name: "STAGE 2 - TWIN TOWERS",
        themeColor: "#ec4899",
        themeHighlight: "#f9a8d4",
        platforms: [
            { x: 24,  y: 376, w: 200 },
            { x: 416, y: 376, w: 200 },
            { x: 160, y: 296, w: 320 },
            { x: 24,  y: 216, w: 180 },
            { x: 436, y: 216, w: 180 },
            { x: 180, y: 136, w: 280 }
        ],
        enemies: [
            { type: 'zen',   x: 200, y: 90,  dir: 1 },
            { type: 'zen',   x: 400, y: 90,  dir: -1 },
            { type: 'might', x: 260, y: 250, dir: 1 },
            { type: 'might', x: 360, y: 250, dir: -1 }
        ]
    },
    {
        name: "STAGE 3 - BUBBLE PALACE",
        themeColor: "#10b981",
        themeHighlight: "#6ee7b7",
        platforms: [
            { x: 110, y: 380, w: 160 },
            { x: 370, y: 380, w: 160 },
            { x: 24,  y: 300, w: 140 },
            { x: 240, y: 300, w: 160 },
            { x: 476, y: 300, w: 140 },
            { x: 110, y: 216, w: 420 },
            { x: 24,  y: 132, w: 180 },
            { x: 436, y: 132, w: 180 }
        ],
        enemies: [
            { type: 'might', x: 160, y: 170, dir: 1 },
            { type: 'might', x: 450, y: 170, dir: -1 },
            { type: 'zen',   x: 80,  y: 80,  dir: 1 },
            { type: 'zen',   x: 520, y: 80,  dir: -1 },
            { type: 'might', x: 310, y: 250, dir: 1 }
        ]
    }
];

// 보너스 아이템 종류 (과일 & 디저트)
const ITEM_TYPES = [
    { name: 'APPLE',    score: 500,  color: '#ef4444', leaf: '#22c55e' },
    { name: 'BANANA',   score: 800,  color: '#facc15', leaf: '#a16207' },
    { name: 'GRAPE',    score: 1200, color: '#a855f7', leaf: '#22c55e' },
    { name: 'CANDY',    score: 2000, color: '#38bdf8', leaf: '#f472b6' },
    { name: 'CAKE',     score: 3000, color: '#fb7185', leaf: '#fef08a' }
];

// ----------------------------------------------------------------------------
// 3. 게임 상태 및 엔티티 관리
// ----------------------------------------------------------------------------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'TITLE'; // TITLE, STAGE_INTRO, PLAYING, STAGE_CLEAR, GAME_OVER, VICTORY
let stateTimer = 0;
let currentStageIdx = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('bubbleBobbleHighScore') || '10000', 10);
let lives = 3;
let globalTick = 0;

// 입력 상태
const keys = {
    left: false,
    right: false,
    up: false,
    fire: false
};
let firePressedLastFrame = false;
let upPressedLastFrame = false;

// 플레이어(버블 드래곤 'Bub') 객체
const player = {
    x: 64,
    y: H - FLOOR_H - 34,
    w: 30,
    h: 32,
    vx: 0,
    vy: 0,
    dir: 1, // 1: 오른쪽, -1: 왼쪽
    onGround: false,
    invulnTimer: 0,
    shootAnimTimer: 0,
    walkFrame: 0
};

let bubbles = [];
let enemies = [];
let items = [];
let particles = [];
let floatingTexts = [];

// ----------------------------------------------------------------------------
// 4. 게임 초기화 및 스테이지 로드 함수
// ----------------------------------------------------------------------------
function resetPlayerPosition() {
    player.x = 56;
    player.y = H - FLOOR_H - player.h;
    player.vx = 0;
    player.vy = 0;
    player.dir = 1;
    player.onGround = true;
    player.invulnTimer = 120; // 2초 무적
}

function loadStage(idx) {
    currentStageIdx = idx % STAGES.length;
    const stageData = STAGES[currentStageIdx];
    const loopDifficulty = Math.floor(idx / STAGES.length); // 3스테이지 클리어 후 루프 난이도 증가

    bubbles = [];
    items = [];
    particles = [];
    floatingTexts = [];
    resetPlayerPosition();

    enemies = stageData.enemies.map(e => ({
        type: e.type, // 'zen' (태엽 로봇) 또는 'might' (유령/몬스터)
        x: e.x,
        y: e.y,
        w: 30,
        h: 30,
        vx: e.dir * (e.type === 'might' ? 1.85 : 1.45) * (1 + loopDifficulty * 0.2),
        vy: 0,
        dir: e.dir,
        onGround: false,
        angry: false,
        jumpCooldown: 60 + Math.floor(Math.random() * 90),
        walkFrame: 0
    }));

    gameState = 'STAGE_INTRO';
    stateTimer = 90;
    updateHUD();
}

function startNewGame() {
    audio.init();
    score = 0;
    lives = 3;
    loadStage(0);
    if (audio.bgmEnabled) audio.startBgm();
}

function addScore(pts, x = null, y = null, label = null) {
    score += pts;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('bubbleBobbleHighScore', highScore.toString());
    }
    if (x !== null && y !== null) {
        floatingTexts.push({
            x,
            y,
            text: label || `+${pts}`,
            color: pts >= 2000 ? '#facc15' : '#ffffff',
            life: 48
        });
    }
    updateHUD();
}

function updateHUD() {
    document.getElementById('hudScore').textContent = score.toString().padStart(6, '0');
    document.getElementById('hudHighScore').textContent = highScore.toString().padStart(6, '0');
    document.getElementById('hudStage').textContent = (currentStageIdx + 1).toString().padStart(2, '0');
    const hearts = lives > 0 ? '🦖'.repeat(lives) : '💀';
    document.getElementById('hudLives').textContent = hearts;
}

// ----------------------------------------------------------------------------
// 5. 물리 충돌 및 거품 연쇄 폭발 로직
// ----------------------------------------------------------------------------
function checkPlatformLanding(entity, prevBottom) {
    // 바닥 충돌
    if (entity.y + entity.h >= H - FLOOR_H) {
        entity.y = H - FLOOR_H - entity.h;
        entity.vy = 0;
        entity.onGround = true;
        return;
    }

    // 단방향(One-way) 플랫폼: 아래로 떨어질 때만 위에서 착지
    if (entity.vy >= 0) {
        const stage = STAGES[currentStageIdx];
        const currBottom = entity.y + entity.h;
        for (const p of stage.platforms) {
            if (
                entity.x + entity.w - 4 > p.x &&
                entity.x + 4 < p.x + p.w &&
                prevBottom <= p.y + 6 &&
                currBottom >= p.y
            ) {
                entity.y = p.y - entity.h;
                entity.vy = 0;
                entity.onGround = true;
                return;
            }
        }
    }
    entity.onGround = false;
}

function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const speed = 1.5 + Math.random() * 3.5;
        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            color,
            size: 3 + Math.random() * 3,
            life: 24 + Math.floor(Math.random() * 12)
        });
    }
}

// 거품 터뜨리기 & 인접 거품 연쇄 폭발(Chain Reaction)
function popBubbleChain(startBubble) {
    const queue = [startBubble];
    const poppedList = [];
    startBubble.dead = true;

    while (queue.length > 0) {
        const curr = queue.shift();
        poppedList.push(curr);

        // 반경 56px 이내의 다른 거품도 연쇄적으로 터뜨림
        for (const other of bubbles) {
            if (!other.dead) {
                const dx = (curr.x + curr.r) - (other.x + other.r);
                const dy = (curr.y + curr.r) - (other.y + other.r);
                if (Math.hypot(dx, dy) < 58) {
                    other.dead = true;
                    queue.push(other);
                }
            }
        }
    }

    let trappedCount = 0;
    poppedList.forEach((b, idx) => {
        spawnParticles(b.x + b.r, b.y + b.r, b.trappedEnemy ? '#f43f5e' : '#38bdf8', 12);

        if (b.trappedEnemy) {
            trappedCount++;
            // 갇혀 있던 적이 보너스 과일 아이템으로 변신해 튀어오름
            const itemTier = Math.min(trappedCount - 1, ITEM_TYPES.length - 1);
            const itemSpec = ITEM_TYPES[itemTier];
            items.push({
                x: b.x + 4,
                y: b.y,
                w: 24,
                h: 24,
                vx: (Math.random() - 0.5) * 4.5,
                vy: -5.5 - Math.random() * 2,
                spec: itemSpec,
                life: 480 // 8초간 유지
            });
            addScore(100 * trappedCount, b.x + 16, b.y, trappedCount > 1 ? `${trappedCount} CHAIN!` : '+100');
        } else {
            addScore(10);
        }
    });

    audio.playPop(trappedCount);
}

// ----------------------------------------------------------------------------
// 6. 메인 업데이트 루프
// ----------------------------------------------------------------------------
function update() {
    globalTick++;

    // 파티클 및 플로팅 텍스트 업데이트
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
    });
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(ft => {
        ft.y -= 0.7;
        ft.life--;
    });
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);

    if (gameState === 'STAGE_INTRO') {
        stateTimer--;
        if (stateTimer <= 0) gameState = 'PLAYING';
        return;
    }

    if (gameState === 'STAGE_CLEAR') {
        stateTimer--;
        if (stateTimer <= 0) {
            loadStage(currentStageIdx + 1);
        }
        return;
    }

    if (gameState !== 'PLAYING') return;

    // --- 1) 플레이어 이동 & 점프 & 거품 발사 ---
    if (player.invulnTimer > 0) player.invulnTimer--;
    if (player.shootAnimTimer > 0) player.shootAnimTimer--;

    const moveSpeed = 3.6;
    if (keys.left) {
        player.vx = -moveSpeed;
        player.dir = -1;
        player.walkFrame += 0.25;
    } else if (keys.right) {
        player.vx = moveSpeed;
        player.dir = 1;
        player.walkFrame += 0.25;
    } else {
        player.vx = 0;
        player.walkFrame = 0;
    }

    // 점프
    if (keys.up && !upPressedLastFrame && player.onGround) {
        player.vy = -10.8;
        player.onGround = false;
        audio.playJump();
    }
    upPressedLastFrame = keys.up;

    // 거품 발사
    if (keys.fire && !firePressedLastFrame) {
        player.shootAnimTimer = 12;
        audio.playShoot();
        bubbles.push({
            x: player.dir === 1 ? player.x + player.w - 4 : player.x - 28,
            y: player.y + 2,
            r: 16,
            vx: player.dir * 7.8,
            vy: 0,
            state: 'SHOOT', // SHOOT -> FLOAT
            shootTimer: 18,
            floatTimer: 540, // 9초 뒤 터지거나 적 탈출
            trappedEnemy: null,
            dead: false
        });
    }
    firePressedLastFrame = keys.fire;

    const prevPlayerBottom = player.y + player.h;
    player.x += player.vx;
    player.vy = Math.min(player.vy + GRAVITY, MAX_FALL_SPEED);
    player.y += player.vy;

    // 좌우 벽 경계
    if (player.x < WALL_W) player.x = WALL_W;
    if (player.x + player.w > W - WALL_W) player.x = W - WALL_W - player.w;

    // 천장 뚫고 올라가면 아래로 워프 (보글보글 고유 특징)
    if (player.y > H) player.y = 0;

    checkPlatformLanding(player, prevPlayerBottom);

    // --- 2) 거품(Bubbles) 업데이트 ---
    for (const b of bubbles) {
        if (b.dead) continue;

        if (b.state === 'SHOOT') {
            b.x += b.vx;
            b.vx *= 0.94;
            b.shootTimer--;

            // 벽에 닿으면 즉시 부유 상태로 전환
            if (b.x < WALL_W) {
                b.x = WALL_W;
                b.state = 'FLOAT';
            } else if (b.x + b.r * 2 > W - WALL_W) {
                b.x = W - WALL_W - b.r * 2;
                b.state = 'FLOAT';
            }

            // 발사 중인 거품이 적과 충돌하면 포획
            if (!b.trappedEnemy) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (
                        b.x < e.x + e.w &&
                        b.x + b.r * 2 > e.x &&
                        b.y < e.y + e.h &&
                        b.y + b.r * 2 > e.y
                    ) {
                        b.trappedEnemy = e;
                        b.state = 'FLOAT';
                        b.floatTimer = 450; // 7.5초 안에 터뜨려야 함
                        enemies.splice(i, 1);
                        audio.playPop(0);
                        break;
                    }
                }
            }

            if (b.shootTimer <= 0) {
                b.state = 'FLOAT';
            }
        } else {
            // FLOAT 상태: 천장 기류를 향해 부유
            b.floatTimer--;
            const targetY = 44;
            if (b.y > targetY) {
                b.y -= b.trappedEnemy ? 0.95 : 1.35;
                b.x += Math.sin(globalTick * 0.08 + b.floatTimer * 0.1) * 0.6;
            } else {
                // 천장 도달 시 중앙 기류 쪽으로 천천히 모임
                const centerTarget = W / 2 - b.r;
                b.x += (centerTarget - b.x) * 0.015;
                b.y = targetY + Math.sin(globalTick * 0.1 + b.x * 0.05) * 3;
            }

            // 경계 보정
            if (b.x < WALL_W) b.x = WALL_W;
            if (b.x + b.r * 2 > W - WALL_W) b.x = W - WALL_W - b.r * 2;

            // 시간 초과 처리
            if (b.floatTimer <= 0) {
                b.dead = true;
                spawnParticles(b.x + b.r, b.y + b.r, '#94a3b8', 6);
                if (b.trappedEnemy) {
                    // 적이 거품을 찢고 분노(Angry) 상태로 탈출!
                    const escaped = b.trappedEnemy;
                    escaped.x = b.x;
                    escaped.y = b.y;
                    escaped.vy = -3;
                    escaped.angry = true;
                    escaped.vx = (escaped.dir || 1) * 2.9;
                    enemies.push(escaped);
                    floatingTexts.push({ x: escaped.x, y: escaped.y - 8, text: 'ANGRY!', color: '#ef4444', life: 45 });
                }
            }
        }

        // 플레이어가 거품에 닿았을 때 처리
        if (!b.dead) {
            const pCenterX = player.x + player.w / 2;
            const pCenterY = player.y + player.h / 2;
            const bCenterX = b.x + b.r;
            const bCenterY = b.y + b.r;
            const dist = Math.hypot(pCenterX - bCenterX, pCenterY - bCenterY);

            if (dist < b.r + 13) {
                // 부유 중인 거품이나 적이 갇힌 거품은 터뜨림
                if (b.state === 'FLOAT' || b.trappedEnemy) {
                    popBubbleChain(b);
                }
            }
        }
    }
    bubbles = bubbles.filter(b => !b.dead);

    // --- 3) 적(Enemies) AI 업데이트 ---
    for (const e of enemies) {
        e.walkFrame += e.angry ? 0.35 : 0.2;
        const prevBottom = e.y + e.h;

        // 플레이어가 위층에 있으면 가끔 점프 시도
        e.jumpCooldown--;
        if (e.onGround && e.jumpCooldown <= 0) {
            if (player.y < e.y - 20 || Math.random() < 0.35) {
                e.vy = e.angry ? -11.2 : -10.2;
                e.onGround = false;
                // 플레이어 방향으로 방향 전환
                e.dir = player.x > e.x ? 1 : -1;
                const spd = (e.type === 'might' ? 1.85 : 1.45) * (e.angry ? 1.65 : 1);
                e.vx = e.dir * spd;
            }
            e.jumpCooldown = e.angry ? 45 + Math.random() * 40 : 75 + Math.random() * 75;
        }

        e.x += e.vx;
        e.vy = Math.min(e.vy + GRAVITY, MAX_FALL_SPEED);
        e.y += e.vy;

        // 좌우 벽 반사
        if (e.x <= WALL_W) {
            e.x = WALL_W;
            e.dir = 1;
            e.vx = Math.abs(e.vx);
        } else if (e.x + e.w >= W - WALL_W) {
            e.x = W - WALL_W - e.w;
            e.dir = -1;
            e.vx = -Math.abs(e.vx);
        }

        if (e.y > H) e.y = 0;

        checkPlatformLanding(e, prevBottom);

        // 플레이어와 적 충돌 체크
        if (
            player.invulnTimer <= 0 &&
            player.x + 5 < e.x + e.w - 4 &&
            player.x + player.w - 5 > e.x + 4 &&
            player.y + 5 < e.y + e.h - 4 &&
            player.y + player.h - 5 > e.y + 4
        ) {
            handlePlayerHit();
            break;
        }
    }

    // --- 4) 보너스 아이템(과일/디저트) 업데이트 ---
    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.life--;
        const prevBottom = it.y + it.h;

        it.x += it.vx;
        it.vy = Math.min(it.vy + GRAVITY * 0.85, MAX_FALL_SPEED);
        it.y += it.vy;

        if (it.x < WALL_W) { it.x = WALL_W; it.vx *= -0.7; }
        if (it.x + it.w > W - WALL_W) { it.x = W - WALL_W - it.w; it.vx *= -0.7; }

        checkPlatformLanding(it, prevBottom);
        if (it.onGround) {
            it.vx *= 0.82;
        }

        // 플레이어 획득 판정
        if (
            player.x < it.x + it.w &&
            player.x + player.w > it.x &&
            player.y < it.y + it.h &&
            player.y + player.h > it.y
        ) {
            audio.playPickup();
            spawnParticles(it.x + 12, it.y + 12, it.spec.color, 12);
            addScore(it.spec.score, it.x + 12, it.y, `+${it.spec.score}`);
            items.splice(i, 1);
            continue;
        }

        if (it.life <= 0) {
            items.splice(i, 1);
        }
    }

    // --- 5) 스테이지 클리어 판정 ---
    const anyTrapped = bubbles.some(b => b.trappedEnemy !== null);
    if (enemies.length === 0 && !anyTrapped && items.length === 0) {
        gameState = 'STAGE_CLEAR';
        stateTimer = 135;
        addScore(1000 * (currentStageIdx + 1));
        audio.playStageClear();
    }
}

function handlePlayerHit() {
    lives--;
    updateHUD();
    audio.playHurt();
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#4ade80', 18);

    if (lives <= 0) {
        gameState = 'GAME_OVER';
        audio.stopBgm();
        audio.playGameOver();
    } else {
        resetPlayerPosition();
    }
}

// ----------------------------------------------------------------------------
// 7. 레트로 픽셀 아트 렌더링 엔진
// ----------------------------------------------------------------------------
function drawBrickBlock(x, y, w, h, mainColor, lightColor) {
    ctx.fillStyle = mainColor;
    ctx.fillRect(x, y, w, h);

    // 상단 하이라이트 픽셀 테두리
    ctx.fillStyle = lightColor;
    ctx.fillRect(x, y, w, 3);

    // 벽돌 패턴 라인
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, y + h - 3, w, 3);
    for (let bx = x; bx < x + w; bx += 24) {
        ctx.fillRect(bx, y, 2, h);
    }
}

function drawStage() {
    const stage = STAGES[currentStageIdx];

    // 좌우 외벽 & 천장/바닥
    for (let y = 0; y < H; y += 24) {
        drawBrickBlock(0, y, WALL_W, 24, stage.themeColor, stage.themeHighlight);
        drawBrickBlock(W - WALL_W, y, WALL_W, 24, stage.themeColor, stage.themeHighlight);
    }
    for (let x = 0; x < W; x += 24) {
        drawBrickBlock(x, 0, 24, 16, stage.themeColor, stage.themeHighlight);
        drawBrickBlock(x, H - FLOOR_H, 24, FLOOR_H, stage.themeColor, stage.themeHighlight);
    }

    // 단방향 발판 렌더링
    for (const p of stage.platforms) {
        drawBrickBlock(p.x, p.y, p.w, 16, stage.themeColor, stage.themeHighlight);
    }
}

// 초록 아기 공룡 'Bub' 픽셀 스프라이트 렌더링
function drawBub(x, y, dir, walkFrame, isShooting, blink) {
    if (blink && Math.floor(globalTick / 4) % 2 === 0) return;

    ctx.save();
    ctx.translate(Math.round(x + 15), Math.round(y + 16));
    ctx.scale(dir, 1);

    // 등 지느러미 (주황색 뿔)
    ctx.fillStyle = '#f97316';
    ctx.fillRect(-13, -10, 5, 5);
    ctx.fillRect(-14, -2, 6, 5);
    ctx.fillRect(-13, 6, 5, 4);

    // 몸통 & 머리 (선명한 보글보글 그린)
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(-9, -13, 18, 13); // 머리
    ctx.fillRect(-10, 0, 19, 12);  // 몸통
    ctx.fillRect(-13, 8, 6, 5);    // 꼬리

    // 하얀 배 부분
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(2, 1, 7, 10);

    // 큰 눈망울
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(2, -10, 6, 7);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(5, -8, 3, 4);

    // 거품 발사 시 입 벌리기
    if (isShooting) {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(7, -2, 6, 5);
    }

    // 걷기 애니메이션 발
    const step = Math.sin(walkFrame) * 3;
    ctx.fillStyle = '#15803d';
    ctx.fillRect(-7 + step, 12, 6, 4);
    ctx.fillRect(2 - step, 12, 6, 4);

    ctx.restore();
}

// 클래식 적 캐릭터 ('zen': 태엽 로봇 / 'might': 로브 몬스터)
function drawEnemy(e, isTrapped = false) {
    ctx.save();
    ctx.translate(Math.round(e.x + 15), Math.round(e.y + 15));
    if (!isTrapped) ctx.scale(e.dir || 1, 1);

    const primary = e.angry ? '#ef4444' : (e.type === 'might' ? '#a855f7' : '#f59e0b');
    const secondary = e.angry ? '#fca5a5' : (e.type === 'might' ? '#e9d5ff' : '#fef08a');

    if (e.type === 'zen') {
        // 태엽 감긴 아케이드 로봇 (Zen-chan 스타일)
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(-2, -15, 4, 4);
        ctx.fillRect(-6, -16, 12, 2); // 태엽 키

        ctx.fillStyle = primary;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        // 고글 & 눈
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-2, -6, 12, 6);
        ctx.fillStyle = secondary;
        ctx.fillRect(1, -5, 3, 4);
        ctx.fillRect(6, -5, 3, 4);

        // 발
        const step = isTrapped ? Math.sin(globalTick * 0.4) * 2 : Math.sin(e.walkFrame) * 3;
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-7 + step, 10, 6, 4);
        ctx.fillRect(2 - step, 10, 6, 4);
    } else {
        // 후드 몬스터 (Mighta 스타일)
        ctx.fillStyle = primary;
        ctx.fillRect(-11, -12, 22, 24);
        ctx.fillRect(-8, -15, 16, 4);

        // 어두운 얼굴 안쪽 빛나는 눈
        ctx.fillStyle = '#090a0f';
        ctx.fillRect(-5, -7, 13, 9);
        ctx.fillStyle = secondary;
        ctx.fillRect(-2, -4, 3, 3);
        ctx.fillRect(4, -4, 3, 3);
    }

    ctx.restore();
}

function drawBubble(b) {
    const cx = Math.round(b.x + b.r);
    const cy = Math.round(b.y + b.r);

    // 갇힌 적이 있을 경우 먼저 내부에 렌더링
    if (b.trappedEnemy) {
        b.trappedEnemy.x = b.x + 1;
        b.trappedEnemy.y = b.y + 1;
        drawEnemy(b.trappedEnemy, true);
    }

    // 탈출 임박 시(2.2초 이하) 빨간색으로 깜빡임 경고
    const isWarning = b.trappedEnemy && b.floatTimer < 130 && Math.floor(globalTick / 6) % 2 === 0;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, b.r, 0, Math.PI * 2);
    ctx.fillStyle = isWarning
        ? 'rgba(239, 68, 68, 0.38)'
        : (b.trappedEnemy ? 'rgba(244, 63, 94, 0.25)' : 'rgba(56, 189, 248, 0.28)');
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = isWarning ? '#ef4444' : (b.trappedEnemy ? '#fb7185' : '#38bdf8');
    ctx.stroke();

    // 거품 반사광 하이라이트
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 8, cy - 8, 4, 4);
    ctx.fillRect(cx - 4, cy - 10, 3, 2);
    ctx.restore();
}

function drawItem(it) {
    const cx = Math.round(it.x + 12);
    const cy = Math.round(it.y + 12);
    const blink = it.life < 90 && Math.floor(globalTick / 5) % 2 === 0;
    if (blink) return;

    ctx.save();
    // 과일 본체
    ctx.fillStyle = it.spec.color;
    ctx.beginPath();
    ctx.arc(cx, cy + 2, 9, 0, Math.PI * 2);
    ctx.fill();

    // 잎사귀/장식
    ctx.fillStyle = it.spec.leaf;
    ctx.fillRect(cx - 2, cy - 10, 6, 4);

    // 반짝임
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 4, cy - 2, 3, 3);
    ctx.restore();
}

function drawOverlayBox(title, subtitle, subColor = '#38bdf8', promptText = null) {
    ctx.fillStyle = 'rgba(5, 6, 10, 0.78)';
    ctx.fillRect(70, 120, W - 140, 230);

    ctx.strokeStyle = subColor;
    ctx.lineWidth = 4;
    ctx.strokeRect(70, 120, W - 140, 230);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 26px "Press Start 2P", "Noto Sans KR", monospace';
    ctx.fillText(title, W / 2, 185);

    ctx.fillStyle = subColor;
    ctx.font = 'bold 14px "Press Start 2P", "Noto Sans KR", monospace';
    ctx.fillText(subtitle, W / 2, 230);

    if (promptText && Math.floor(globalTick / 20) % 2 === 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 13px "Press Start 2P", "Noto Sans KR", monospace';
        ctx.fillText(promptText, W / 2, 295);
    }
}

function render() {
    // 1. 배경 클리어
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, W, H);

    // 2. 스테이지 지형 렌더링
    drawStage();

    // 3. 아이템, 적, 플레이어, 거품 렌더링
    items.forEach(drawItem);
    enemies.forEach(e => drawEnemy(e, false));

    if (gameState !== 'GAME_OVER') {
        drawBub(
            player.x,
            player.y,
            player.dir,
            player.walkFrame,
            player.shootAnimTimer > 0,
            player.invulnTimer > 0
        );
    }

    bubbles.forEach(drawBubble);

    // 4. 파티클 & 점수 텍스트 렌더링
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    ctx.textAlign = 'center';
    floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 11px "Press Start 2P", monospace';
        ctx.fillText(ft.text, ft.x, ft.y);
    });

    // 5. 게임 상태별 오버레이 UI
    if (gameState === 'TITLE') {
        drawOverlayBox(
            'BUBBLE BOBBLE',
            '보글보글 아케이드 에디션',
            '#4ade80',
            'PRESS SPACE OR FIRE TO START'
        );
    } else if (gameState === 'STAGE_INTRO') {
        drawOverlayBox(
            `STAGE 0${currentStageIdx + 1}`,
            STAGES[currentStageIdx].name,
            '#38bdf8',
            'READY!'
        );
    } else if (gameState === 'STAGE_CLEAR') {
        drawOverlayBox(
            'STAGE CLEAR!',
            `BONUS +${1000 * (currentStageIdx + 1)} PTS`,
            '#4ade80',
            'NEXT STAGE...'
        );
    } else if (gameState === 'GAME_OVER') {
        drawOverlayBox(
            'GAME OVER',
            `FINAL SCORE: ${score}`,
            '#f43f5e',
            'PRESS SPACE OR RESTART'
        );
    }
}

// ----------------------------------------------------------------------------
// 8. 반응형 고해상도 캔버스 스케일링 & 메인 게임 루프
// ----------------------------------------------------------------------------
function resizeCanvas() {
    const wrapper = document.getElementById('screenWrapper');
    const dpr = window.devicePixelRatio || 1;
    const rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingEnabled = false;
}

window.addEventListener('resize', resizeCanvas);

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// ----------------------------------------------------------------------------
// 9. 키보드 & 터치/마우스 컨트롤 바인딩
// ----------------------------------------------------------------------------
function handleActionTrigger() {
    if (gameState === 'TITLE' || gameState === 'GAME_OVER') {
        startNewGame();
    }
}

window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
    if (e.code === 'Space' || e.code === 'KeyZ') {
        keys.fire = true;
        handleActionTrigger();
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
    if (e.code === 'Space' || e.code === 'KeyZ') keys.fire = false;
});

function bindTouchButton(btnId, keyName, isAction = false) {
    const btn = document.getElementById(btnId);
    const startHandler = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        btn.classList.add('pressed');
        if (isAction) handleActionTrigger();
    };
    const endHandler = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('pressed');
    };

    btn.addEventListener('mousedown', startHandler);
    btn.addEventListener('mouseup', endHandler);
    btn.addEventListener('mouseleave', endHandler);
    btn.addEventListener('touchstart', startHandler, { passive: false });
    btn.addEventListener('touchend', endHandler, { passive: false });
    btn.addEventListener('touchcancel', endHandler, { passive: false });
}

bindTouchButton('btnLeft', 'left');
bindTouchButton('btnRight', 'right');
bindTouchButton('btnJump', 'up');
bindTouchButton('btnFire', 'fire', true);

// 사운드 & 재시작 버튼
const btnSfx = document.getElementById('btnSfx');
const btnBgm = document.getElementById('btnBgm');
const btnRestart = document.getElementById('btnRestart');

btnSfx.addEventListener('click', () => {
    audio.sfxEnabled = !audio.sfxEnabled;
    btnSfx.textContent = audio.sfxEnabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
    btnSfx.classList.toggle('active', audio.sfxEnabled);
    if (audio.sfxEnabled) audio.playPickup();
});

btnBgm.addEventListener('click', () => {
    audio.bgmEnabled = !audio.bgmEnabled;
    btnBgm.textContent = audio.bgmEnabled ? '🎵 BGM: ON' : '🎵 BGM: OFF';
    btnBgm.classList.toggle('active', audio.bgmEnabled);
    if (audio.bgmEnabled && gameState === 'PLAYING') {
        audio.startBgm();
    } else {
        audio.stopBgm();
    }
});

btnRestart.addEventListener('click', () => {
    startNewGame();
});

// 초기 실행
window.onload = function () {
    updateHUD();
    resizeCanvas();
    gameLoop();
};
</script>
</body>
</html>
